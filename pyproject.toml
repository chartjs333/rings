[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rings-fly"
version = "0.1.0"
description = "Experimental RINGS phase nodes on directed Drosophila connectome graphs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
license = {file = "LICENSE.txt"}

[project.optional-dependencies]
flywire = ["pandas>=2", "pyarrow>=20"]

[project.scripts]
rings-fly = "rings_fly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

